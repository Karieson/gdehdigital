<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Units</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  background:#ffffff;
  color:#222;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-size:13px;
}

header{
  background:transparent;
  padding:12px 20px;
  display:flex;
  align-items:center;
}

header img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.hero{
  text-align:center;
  padding:20px 15px 10px;
}

.hero h2{
  font-size:15px;
  color:#000;
  font-weight:600;
  margin-bottom:8px;
}

.hero p{
  font-size:12px;
  color:#000;
  line-height:1.7;
  max-width:700px;
  margin:auto;
}

.container{
  flex:1;
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.card h3{
  color:#000;
  font-size:14px;
  margin-bottom:14px;
  font-weight:600;
}

.card ul{
  list-style:none;
}

.card ul li{
  font-size:12px;
  color:#000;
  line-height:1.9;
  border-bottom:1px solid #f1f1f1;
  padding:6px 0;
}

footer{
  color:darkorange;
  text-align:center;
  padding:18px;
  margin-top:auto;
  width:100%;
  font-size:12px;
  font-weight:500;
  background:transparent;
  border-top:1px solid #e5e5e5;
}

</style>
</head>
<body>

<header>
  <img src="gdeh_logo.png" alt="GDEH Logo">
</header>

<section class="hero">

  <h2 id="courseTitle">
    Course Units
  </h2>

  <p>
    Browse course units offered under GDEH CBO training programmes.
  </p>

</section>

<section class="container">

  <div class="card">

    <h3 id="courseTitle"></h3>

    <ul id="unitsContainer"></ul>

  </div>

</section>

<footer>
  © GDEH CBO COURSED All right reserved
</footer>

<script src="courses.js"></script>

</body>
</html>
