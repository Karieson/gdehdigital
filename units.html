<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Units</title>

<style>

:root{
    --corporate-red:#C00000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#fff;
    color:#222;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-size:12px;
    line-height:1.8;
}

/* Header */

header{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px 20px;
    background:#fff;
    border-bottom:3px solid var(--corporate-red);
}

header img{
    width:60px;
    height:auto;
}

/* Hero */

.hero{
    text-align:center;
    padding:35px 20px 25px;
    background:#fff;
}

.hero h2{
    color:var(--corporate-red);
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;
}

.hero p{
    color:#222;
    font-size:12px;
    max-width:700px;
    margin:auto;
}

/* Container */

.container{
    flex:1;
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* Card */

.card{
    background:#fff;
    border:2px solid var(--corporate-red);
    border-radius:10px;
    padding:22px;
    transition:.3s;
}

.card:hover{
    box-shadow:0 8px 18px rgba(0,0,0,.10);
}

.card h3{
    color:var(--corporate-red);
    font-size:16px;
    font-weight:700;
    margin-bottom:18px;
    padding-left:10px;
    border-left:5px solid var(--corporate-red);
}

/* Units */

.card ul{
    list-style:none;
}

.card ul li{
    padding:12px 0;
    border-bottom:1px solid #ddd;
    color:#222;
    font-size:12px;
}

.card ul li:last-child{
    border-bottom:none;
}

/* Footer */

footer{
    margin-top:40px;
    padding:20px;
    background:#fff;
    border-top:3px solid var(--corporate-red);
    text-align:center;
    color:#222;
    font-size:12px;
    font-weight:600;
}

/* Mobile */

@media(max-width:768px){

header img{
    width:50px;
}

.hero h2{
    font-size:20px;
}

.hero p{
    font-size:12px;
}

.container{
    padding:15px;
}

.card{
    padding:18px;
}

.card h3{
    font-size:15px;
}

}
</style>
</head>
<body>

<header>
  <img src="gadeh_logo.png" alt="GDEH Logo">
</header>

<section class="hero">

  <h2 id="courseTitle">
    Course Units
  </h2>

  <p>
    Browse course units offered under GDEH CBO training programmes.
  </p>

</section>

<section class="container">

  <div class="card">

    <h3 id="courseTitle"></h3>

    <ul id="unitsContainer"></ul>

  </div>

</section>

<footer>
  © GDEH CBO COURSED All right reserved
</footer>

<script src="courses.js"></script>

</body>
</html>
