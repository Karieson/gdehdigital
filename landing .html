<meta charset="UTF-8">
<title>GDEH Donation & Partnership Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ====== GLOBAL STYLE ====== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

/* ====== HEADER ====== */
.header {
  background: #B8860B;
  color: white;
  text-align: center;
  padding: 20px;
}

.header img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  padding: 5px;
}

.header h1 {
  margin: 10px 0 5px;
}

.header p {
  font-size: 14px;
  margin: 0;
}

/* ====== FORM CONTAINER ====== */
.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

/* ====== SECTION TITLE ====== */
.section-title {
  border-left: 4px solid #C49A00;
  padding-left: 10px;
  margin-top: 20px;

  font-weight: normal;   /* removes bold */
  font-size: 12px;
  color: #003366;

}

/* ====== INPUT FIELDS ====== */
input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 12px;
}

label {
  font-weight: normal;
  font-size: 12px;
}

/* ====== CHECKBOX GROUP ====== */
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.checkbox-group label {
  font-weight: normal;
}
.donate-btn,
.submit-btn {
  width: auto;              /* remove full width */
  min-width: 160px;         /* small but readable */
  padding: 10px 18px;       /* smaller size */
  border: none;
  border-radius: 8px;

  font-size: 14px;
  cursor: pointer;
  color: #fff;

  background: #B8860B;
  box-shadow: 0 0 10px rgba(184, 134, 11, 0.6);

  display: block;

  margin: 15px auto;        /* THIS centers the button */

  transition: all 0.3s ease;
}

/* hover */
.donate-btn:hover,
.submit-btn:hover {
  background: #C49A00;
  box-shadow: 0 0 18px rgba(196, 154, 0, 0.9);
  transform: translateY(-2px);
}

/* click */
.donate-btn:active,
.submit-btn:active {
  transform: scale(0.96);
}
.file-upload::file-selector-button {
  background: #B8860B;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
}


/* ====== FOOTER ====== */
.footer {
  text-align: center;
  padding: 15px;
  background: #000;
  color: #C49A00;
  margin-top: 30px;
  font-size: 13px;
}
</style>
</head>

<script>
function payNow() {
  const consent = document.getElementById("consentCheck");

  if (!consent.checked) {
    alert("Please agree to the consent before donating.");
    consent.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  window.location.href = "https://www.pesapal.com/checkout/YOUR_UNIQUE_LINK";
}
</script>
