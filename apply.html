<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Online Application Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    padding:20px;
    color:#fff;
    font-size:11px;
}

/* HEADER OUTSIDE FRAME */
.top-bar{
    display:flex;
    align-items:center;
    gap:15px;
    margin:0 auto 20px auto;
    max-width:900px;
}

.logo{
    width:100px;
    height:auto;
}

h1{
    color:#fff;
    font-size:16px;
    font-weight:700;
}

/* FRAME */
.container{
    max-width:900px;
    margin:auto;
    background:#000;
    padding:25px;
    border-radius:10px;
    border:3px solid #cc7000;
    box-shadow:0 0 10px rgba(204,112,0,0.2);
}

/* SECTION TITLES */
h2{
    color:#cc7000;
    font-size:12px;
    font-weight:bold;
    margin:20px 0 10px;
    border-bottom:1px solid #cc7000;
    padding-bottom:5px;
}

/* LABELS */
label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    color:#cc7000;
    font-size:10px;
    font-weight:600;
}

.required{
    color:red;
}

/* INPUTS */
input,
select,
textarea{
    width:100%;
    padding:7px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:5px;
    font-size:11px;
    color:#fff;
    background:#111;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border:1px solid #cc7000;
    box-shadow:0 0 5px rgba(204,112,0,0.5);
}

textarea{
    resize:vertical;
    min-height:70px;
}

/* BUTTON */
.submit-btn{
    background:#cc7000;
    color:#fff;
    border:none;
    padding:10px 18px;
    font-size:12px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 8px rgba(204,112,0,0.5);
}

.submit-btn:hover{
    box-shadow:0 0 15px rgba(204,112,0,0.9);
    transform:scale(1.03);
}

.consent-box{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:20px;
    text-align:center;
}

.consent-box input{
    width:auto;
    margin-top:3px;
}

.consent-box label{
    color:#fff;
    font-size:10px;
    line-height:1.5;
}

/* FOOTER */
.footer{
    margin-top:25px;
    text-align:center;
    padding:10px;
    border-top:1px solid rgba(255,255,255,0.15);
}

.footer p{
    color:#cc7000;
    font-size:10px;
}

/* FOOTER LINKS */
.footer-links{
    text-align:center;
    margin-top:10px;
}

.footer-links a{
    color:#cc7000;
    font-size:10px;
    text-decoration:none;
}

.footer-links a:hover{
    text-decoration:underline;
}

/* MOBILE */
@media(max-width:768px){

    .top-bar{
        flex-direction:column;
        text-align:center;
    }

    h1{
        font-size:14px;
    }

    .container{
        padding:18px;
    }
}

</style>
</head>

<body>

<!-- HEADER OUTSIDE FRAME -->
<div class="top-bar">

    <img src="gdeh_logo.png"
         alt="GDEH Logo"
         class="logo">

    <h1>Online Application Form</h1>

</div>

<!-- FORM FRAME -->
<div class="container">

<form id="admissionForm"
      action="https://gdeh-database.onrender.com/api/admission"
      method="POST"
      enctype="multipart/form-data">

<!-- PERSONAL INFORMATION -->
<h2>Personal Information</h2>

<label>
First Name <span class="required">*</span>
</label>

<input type="text"
       name="first_name"
       required>

<label>
Last Name <span class="required">*</span>
</label>

<input type="text"
       name="last_name"
       required>

<label>
Gender <span class="required">*</span>
</label>

<select name="gender"
        required>

<option value="">
Select Gender
</option>

<option>Male</option>
<option>Female</option>

</select>

<label>
Phone Number <span class="required">*</span>
</label>

<input type="tel"
       name="phone"
       required>

<label>
Email <span class="required">*</span>
</label>

<input type="email"
       name="email"
       required>

<!-- ADDRESS -->
<h2>Address</h2>

<label>
Current Address <span class="required">*</span>
</label>

<textarea name="address"
          required></textarea>

<!-- LOCATION -->
<h2>Location</h2>

<label>
County <span class="required">*</span>
</label>

<select id="county"
        name="county"
        onchange="loadSubCounties()"
        required>

<option value="">
Select County
</option>

<option value="Garissa">
Garissa
</option>

<option value="Wajir">
Wajir
</option>

<option value="Mandera">
Mandera
</option>

</select>

<label>
Sub County <span class="required">*</span>
</label>

<select id="subcounty"
        name="sub_county"
        onchange="loadWards()"
        required>

<option value="">
Select Sub County
</option>

</select>

<label>
Ward <span class="required">*</span>
</label>

<select id="ward"
        name="ward"
        required>

<option value="">
Select Ward
</option>

</select>

<!-- ACADEMIC -->
<h2>Academic</h2>

<label>
Course Applying <span class="required">*</span>
</label>

<select name="course"
        required>

<option>
Smart Phone Literacy
</option>

<option>
Agro-entrepreneurship
</option>

<option>
Computer Literacy
</option>

</select>

<label>
Intake <span class="required">*</span>
</label>

<select name="intake"
        required>

<option>
January Intake
</option>

<option>
May Intake
</option>

<option>
September Intake
</option>

</select>

<label>
Mode of Study <span class="required">*</span>
</label>

<select name="mode_of_study"
        required>

<option>
Online
</option>

<option>
Physical
</option>

<option>
Hybrid
</option>

</select>

<!-- EMERGENCY CONTACT -->
<h2>Emergency Contact</h2>

<label>
Full Name <span class="required">*</span>
</label>

<input type="text"
       name="emergency_contact_name"
       required>

<label>
Phone Number <span class="required">*</span>
</label>

<input type="tel"
       name="emergency_contact_phone"
       required>

<!-- PHOTO -->
<h2>Upload</h2>

<label>
Upload Profile Photo
<span class="required">*</span>
</label>

<input type="file"
       name="photo"
       accept=".jpeg,.jpg,.png"
       required>

<!-- CONSENT -->
<div class="consent-box">

<input type="checkbox"
       id="consent"
       required>

<label for="consent">

I have read and agree to the
Terms & Conditions
<span class="required">*</span>

</label>

</div>

<!-- SUBMIT -->
<div style="text-align:center;
            margin-top:20px;">

<button type="submit"
        class="submit-btn">

Submit Application

</button>

</div>

</form>

</div>

<!-- FOOTER OUTSIDE FRAME -->
<footer class="footer">

<p>
© GDEH Online Application —
All Rights Reserved
</p>

</footer>

<!-- FOOTER LINKS -->
<div class="footer-links">

<a href="privacy_terms.html"
   target="_blank">

Privacy Policy

</a>

|

<a href="privacy_terms.html"
   target="_blank">

Terms & Conditions

</a>

</div>

<script>

const data = {

Garissa: {

"Garissa Township":
["Waberi","Galbet","Township"],

"Ijara":
["Sangailu","Ijara","Masalani"],

"Lagdera":
["Modogashe","Benane","Maalimin"]

},

Wajir: {

"Wajir East":
["Township","Barwago","Khorof"],

"Wajir West":
["Arbajahan","Hadado","Adamasajide"],

"Tarbaj":
["Tarbaj","Elben","Sarman"]

},

Mandera: {

"Mandera East":
["Arabia","Township","Neboi"],

"Mandera West":
["Takaba","Lagsure","Dandu"],

"Banissa":
["Banissa","Derkhale","Malkamari"]

}

};

function loadSubCounties(){

const county =
document.getElementById("county").value;

const subcounty =
document.getElementById("subcounty");

const ward =
document.getElementById("ward");

subcounty.innerHTML =
'<option value="">Select Sub County</option>';

ward.innerHTML =
'<option value="">Select Ward</option>';

if(county && data[county]){

Object.keys(data[county]).forEach(sc => {

subcounty.innerHTML +=
`<option value="${sc}">${sc}</option>`;

});

}

}

function loadWards(){

const county =
document.getElementById("county").value;

const subcounty =
document.getElementById("subcounty").value;

const ward =
document.getElementById("ward");

ward.innerHTML =
'<option value="">Select Ward</option>';

if(county && subcounty){

data[county][subcounty].forEach(w => {

ward.innerHTML +=
`<option value="${w}">${w}</option>`;

});

}

}

/* FORM SUBMIT */

const form =
document.getElementById("admissionForm");

form.addEventListener("submit",
async (e) => {

e.preventDefault();

const formData =
new FormData(form);

try{

const response = await fetch(
"https://gdeh-database.onrender.com/api/admission",
{
method:"POST",
body:formData
}
);

if(response.ok){

alert(
"Application submitted successfully."
);

form.reset();

}else{

alert(
"Failed to submit application."
);

}

}catch(error){

alert(
"Server error. Please try again."
);

}

});

</script>

</body>
</html>
