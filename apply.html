<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Application Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#ffffff;
        padding:20px;
        color:#000;
    }

    .container{
        max-width:900px;
        margin:auto;
        background:#fff;
        padding:25px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.08);
    }

    .top-bar{
        display:flex;
        align-items:center;
        gap:15px;
        margin-bottom:20px;
    }

    .logo{
        width:60px;
        height:auto;
    }

    h1{
        color:orange;
        font-size:16px;
        font-weight:bold;
    }

    h2{
        color:orange;
        font-size:12px;
        font-weight:bold;
        margin:20px 0 10px;
        border-bottom:1px solid orange;
        padding-bottom:5px;
    }

    
    label{
        display:block;
        margin-bottom:5px;
        color:orange;
        font-size:10px;
        font-weight:600;
    }

    input,
    select,
    textarea{
        width:100%;
        padding:5px;
        border:1px solid #ccc;
        border-radius:5px;
        font-size:12px;
        color:#000;
        background:#fff;
    }

    textarea{
        resize:vertical;
        min-height:70px;
    }

    .submit-btn{
        background:orange;
        color:#fff;
        border:none;
        padding:10px 18px;
        font-size:13px;
        border-radius:5px;
        cursor:pointer;
        transition:0.3s;
        box-shadow:0 0 8px rgba(255,165,0,0.6);
    }

    .submit-btn:hover{
        box-shadow:0 0 15px rgba(255,165,0,1);
        transform:scale(1.03);
    }

   .footer {
    background: #000;
    text-align: center;
    padding: 10px 0;
  }
   .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #000;
    text-align: center;
    padding: 8px 0;
  }

  .footer p {
    color: orange;
    font-size: 10px;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .footer p {
    color: orange;
    font-size: 10px;
    margin: 0;
    font-family: Arial, sans-serif;
  }



    
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <img src="gdeh_logo.png" alt="GDEH Logo" class="logo">
        <h1>Online Application Form</h1>
    </div>

    <form>

        <!-- Personal Information -->
        <h2 class="full-width">Personal Information</h2>

        <div>
            <label>First Name</label>
            <input type="text" required>
        </div>

        <div>
            <label>Last Name</label>
            <input type="text" required>
        </div>

        <div>
            <label>Gender</label>
            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
        </div>

        <div>
            <label>Phone Number</label>
            <input type="tel" required>
        </div>

        <div class="full-width">
            <label>Email</label>
            <input type="email" required>
        </div>

        <!-- Address -->
        <h2 class="full-width">Address</h2>

        <div class="full-width">
            <label>Current Address</label>
            <textarea></textarea>
        </div>

        <div class="full-width">
            <label>Permanent Address</label>
            <textarea></textarea>
        </div>

        <!-- Location -->
        <h2 class="full-width">Location</h2>

        <div>
            <label>County</label>
            <select id="county" onchange="loadSubCounties()">
                <option value="">Select County</option>
                <option value="Garissa">Garissa</option>
                <option value="Wajir">Wajir</option>
                <option value="Mandera">Mandera</option>
            </select>
        </div>

        <div>
            <label>Sub County</label>
            <select id="subcounty" onchange="loadWards()">
                <option value="">Select Sub County</option>
            </select>
        </div>

        <div class="full-width">
            <label>Ward</label>
            <select id="ward">
                <option value="">Select Ward</option>
            </select>
        </div>

        <!-- Academic -->
        <h2 class="full-width">Academic</h2>

        <div>
            <label>Course Applying</label>
            <select>
                <option>Smart Phone Literacy</option>
                <option>Agro-entrepreneurship</option>
                <option>Computer Literacy</option>
            </select>
        </div>

        <div>
            <label>Intake</label>
            <select>
                <option>January Intake</option>
                <option>May Intake</option>
                <option>September Intake</option>
            </select>
        </div>

        <div class="full-width">
            <label>Mode</label>
            <select>
                <option>Online</option>
                <option>Physical</option>
                <option>Hybrid</option>
            </select>
        </div>

        <!-- Emergency Contact -->
        <h2 class="full-width">Emergency Contact</h2>

        <div>
            <label>Full Name</label>
            <input type="text">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="tel">
        </div>

        <!-- Upload -->
        <h2 class="full-width">Upload</h2>

        <div class="full-width">
            <label>Upload Profile Photo (jpeg, jpg, png)</label>
            <input type="file" accept=".jpeg,.jpg,.png">
        </div>

        <!-- Submit -->
        <div class="full-width" style="text-align:center; margin-top:10px;">
            <button type="submit" class="submit-btn">Submit</button>
        </div>

    </form>

    <footer class="footer">
  <p>© Gdeh Online Application — All Rights Reserved</p>
</footer>


  
</div>

<script>
    const data = {
        Garissa: {
            "Garissa Township": ["Waberi", "Galbet", "Township"],
            "Ijara": ["Sangailu", "Ijara", "Masalani"],
            "Lagdera": ["Modogashe", "Benane", "Maalimin"]
        },

        Wajir: {
            "Wajir East": ["Township", "Barwago", "Khorof"],
            "Wajir West": ["Arbajahan", "Hadado", "Adamasajide"],
            "Tarbaj": ["Tarbaj", "Elben", "Sarman"]
        },

        Mandera: {
            "Mandera East": ["Arabia", "Township", "Neboi"],
            "Mandera West": ["Takaba", "Lagsure", "Dandu"],
            "Banissa": ["Banissa", "Derkhale", "Malkamari"]
        }
    };

    function loadSubCounties() {
        const county = document.getElementById("county").value;
        const subcounty = document.getElementById("subcounty");
        const ward = document.getElementById("ward");

        subcounty.innerHTML = '<option value="">Select Sub County</option>';
        ward.innerHTML = '<option value="">Select Ward</option>';

        if (county && data[county]) {
            Object.keys(data[county]).forEach(sc => {
                subcounty.innerHTML += `<option value="${sc}">${sc}</option>`;
            });
        }
    }

    function loadWards() {
        const county = document.getElementById("county").value;
        const subcounty = document.getElementById("subcounty").value;
        const ward = document.getElementById("ward");

        ward.innerHTML = '<option value="">Select Ward</option>';

        if (county && subcounty) {
            data[county][subcounty].forEach(w => {
                ward.innerHTML += `<option value="${w}">${w}</option>`;
            });
        }
    }
</script>

</body>
</html>
