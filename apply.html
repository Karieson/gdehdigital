<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Application Form</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* GLOBAL */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#fff;color:#111;font-size:10px;min-height:100vh;}

/* HEADER */
.top-bar{display:flex;align-items:center;gap:10px;margin:20px auto;max-width:900px;padding:10px 0;border-bottom:1px solid #eee;}
.logo{width:70px;height:auto;}
h1{color:#001f3f;font-size:13px;font-weight:700;}
.back-home{

    position:fixed;
    top:10px;
    right:15px;

    font-size:10px;
    font-weight:500;

    color:#001f3f;
    text-decoration:none;

    
}

.back-home:hover{
    text-decoration:underline;
}
/* CONTAINER */
.container{max-width:900px;margin:auto;padding:0 15px 30px;}

/* FORM BOX */
.form-box{background:#fff;border:1px solid #eee;border-radius:15px;padding:25px;}

/* SECTION TITLES */
h2{color:#001f3f;font-size:11px;font-weight:600;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(0,31,63,0.3);}

/* LABELS */
label{display:block;margin-top:6px;margin-bottom:3px;color:#001f3f;font-size:9px;font-weight:500;}
.required{color:red;}

/* INPUTS */
input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:9px;color:#111;background:#fff;transition:0.3s ease;}
input:focus,select:focus,textarea:focus{outline:none;border:1px solid #001f3f;box-shadow:0 0 6px rgba(0,31,63,0.2);}
textarea{resize:vertical;min-height:70px;}

/* BUTTON */
.submit-btn{background:#001f3f;color:#fff;border:none;padding:8px 18px;font-size:9px;border-radius:20px;cursor:pointer;transition:0.3s ease;box-shadow:0 0 10px rgba(0,31,63,0.4);font-weight:600;}
.submit-btn:hover{background:#002b5c;transform:translateY(-1px);box-shadow:0 0 14px rgba(0,31,63,0.6);}

/* CONSENT */
.consent-box{display:flex;align-items:flex-start;gap:6px;margin-top:15px;}
.consent-box input{width:auto;margin-top:3px;}
.consent-box label{color:#333;font-size:8px;line-height:1.5;margin:0;}

/* CAPTCHA BOX */

.captcha-box{
    margin-top:12px;
}

/* CAPTCHA QUESTION */

#captchaQuestion{
    width:100%;
    padding:8px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:11px;
    font-weight:600;
    color:#001f3f;
    background:#f9f9f9;
    text-align:center;
    margin-bottom:8px;
    box-shadow:0 0 5px rgba(0,31,63,0.08);
}

/* CAPTCHA INPUT */

#captchaAnswer{
    width:100%;
    padding:8px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:9px;
    color:#111;
    background:#fff;
    transition:0.3s ease;
}

#captchaAnswer:focus{
    outline:none;
    border:1px solid #001f3f;
    box-shadow:0 0 6px rgba(0,31,63,0.2);
         }
}

/* FOOTER */
footer {
  background: #001f3f;          /* dark navy sticky footer */
  color: #fff;                  /* default text color */
  text-align: center;
  padding: 18px;
  font-size: 12px;
  border-top: 1px solid rgba(255,255,255,0.2);
  position: sticky;             /* sticky at bottom */
  bottom: 0;
  z-index: 1000;
}

/* FOOTER LINKS */
footer a {
  color: #66a3ff;               /* elegant blue links */
  font-weight: 300;
  text-decoration: none;
  transition: color 0.3s ease;
}

footer a:hover {
  color: #99c2ff;               /* lighter blue on hover */
  text-decoration: underline;
}
</style>
</head>

<body>
    <a href="index.html" class="back-home">← Back to Home</a>
<div class="top-bar">
    <img src="gdeh_logo.png" alt="GDEH Logo" class="logo">
    <h1>Online Application Form</h1>
</div>

<div class="container">
<div class="form-box">
<!-- =========================
     FORM
========================= -->
<div class="container">
  <div class="form-box">
    <form id="admissionForm"
          action="https://gdeh-database.onrender.com/api/admission"
          method="POST"
          enctype="multipart/form-data">

      <!-- PERSONAL INFORMATION -->
      <h2>Personal Information</h2>
      <label>First Name <span class="required">*</span></label>
      <input type="text" name="first_name" required>

      <label>Last Name <span class="required">*</span></label>
      <input type="text" name="last_name" required>

      <label>Gender <span class="required">*</span></label>
      <select name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Phone Number <span class="required">*</span></label>
      <input type="tel" name="phone" required>

      <label>Email <span class="required">*</span></label>
      <input type="email" name="email" required>

      <!-- ADDRESS -->
      <h2>Address</h2>
      <label>Current Address <span class="required">*</span></label>
      <textarea name="address" required></textarea>

      <!-- LOCATION -->
      <h2>Location</h2>
      <label>County <span class="required">*</span></label>
      <select id="county" name="county" required>
        <option value="">Select County</option>
        <option value="Garissa">Garissa</option>
        <option value="Wajir">Wajir</option>
        <option value="Mandera">Mandera</option>
      </select>

      <label>Sub County <span class="required">*</span></label>
      <select id="sub_county" name="sub_county" required>
        <option value="">Select Sub County</option>
      </select>

      <label>Ward <span class="required">*</span></label>
      <select id="ward" name="ward" required>
        <option value="">Select Ward</option>
      </select>

      <!-- ACADEMIC -->
      <h2>Academic</h2>
      <label>Course Applying <span class="required">*</span></label>
      <select name="course" required>
        <option>Smart Phone Literacy</option>
        <option>Agro-entrepreneurship</option>
        <option>Computer Literacy</option>
      </select>

      <label>Intake <span class="required">*</span></label>
      <select name="intake" required>
        <option>January Intake</option>
        <option>May Intake</option>
        <option>September Intake</option>
      </select>
<label>Study Session <span class="required">*</span></label>
<select name="mode_of_study" required>
  <option value="">Select Session</option>
  <option>Morning Session</option>
  <option>Afternoon Session</option>
  <option>Evening Session</option>
  <option>Holiday-Based Session</option>
</select>

      <!-- EMERGENCY CONTACT -->
      <h2>Emergency Contact</h2>
      <label>Full Name <span class="required">*</span></label>
      <input type="text" name="emergency_contact_name" required>

      <label>Phone Number <span class="required">*</span></label>
      <input type="tel" name="emergency_contact_phone" required>

      <!-- PHOTO -->
      <h2>Upload</h2>
      <label>Upload Profile Photo <span class="required">*</span></label>
      <input type="file" name="photo" accept=".jpeg,.jpg,.png" required>

      <!-- CONSENT -->
      <div class="consent-box">
        <input type="checkbox" id="consent" required>
        <label for="consent">I have read and agree to the Terms & Conditions <span class="required">*</span></label>
      </div>
<input type="hidden" id="recaptchaToken" name="recaptchaToken">
       
  
</div>
<!-- MATH CAPTCHA -->

<div class="captcha-box">

  <label for="captchaAnswer">
    Solve this math
    <span class="required">*</span>
  </label>

  <div id="captchaQuestion">
    Loading...
  </div>

  <input
    type="number"
    id="captchaAnswer"
    placeholder="Enter answer"
    required
  >

          </div>
      <!-- SUBMIT -->
      <div style="text-align:center;margin-top:20px;">
        <button type="submit" class="submit-btn">Submit Application</button>
      </div>
    </form>
  </div>
</div>
</div>
</div>
    
<!-- ===== FOOTER ===== -->
<div class="footer">
  <p>© 2026 Garissa Digital Empowerment Hub | All Rights Reserved</p>
  <div class="footer-links">
    <a href="privacy_terms.html" target="_blank">Privacy & Terms</a>
  </div>
</div>


<script type="module">

// =========================
// FIREBASE
// =========================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBykVn_PW_IiZ5M1WmcD3mpywHdo3709c0",
  authDomain: "gdehstudents.firebaseapp.com",
  projectId: "gdehstudents",
  storageBucket: "gdehstudents.appspot.com",
  messagingSenderId: "843329725555",
  appId: "1:843329725555:web:e3c0092596b08afa72f606",
  measurementId: "G-2W72F5VP54"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

// Firestore
const db = getFirestore(app);

// Storage (FOR PHOTOS)
const storage = getStorage(app);

// expose for your form logic
window.db = db;
window.storage = storage;
window.addDoc = addDoc;
window.collection = collection;
window.serverTimestamp = serverTimestamp;
window.ref = ref;
window.uploadBytes = uploadBytes;
window.getDownloadURL = getDownloadURL;

// =========================
// CAPTCHA API
// =========================
const API = "https://math-captcha-backend.onrender.com";

// =========================
// LOAD CAPTCHA
// =========================
async function loadCaptcha() {
  try {
    const response = await fetch(`${API}/captcha`, {
      credentials: "include"
    });

    const data = await response.json();

    document.getElementById("captchaQuestion").innerText = data.question;

  } catch (error) {
    console.error("CAPTCHA Load Error:", error);
  }
}

// =========================
// LOCATION DATA
// =========================
const data = {

  Garissa: {
    "Garissa Township": ["Waberi", "Galbet", "Township"],
    "Ijara": ["Sangailu", "Ijara", "Masalani"],
    "Lagdera": ["Modogashe", "Benane", "Maalimin"]
  },

  Wajir: {
    "Wajir East": ["Township", "Barwago", "Khorof"],
    "Wajir West": ["Arbajahan", "Hadado", "Adamasajide"],
    "Tarbaj": ["Tarbaj", "Elben", "Sarman"]
  },

  Mandera: {
    "Mandera East": ["Arabia", "Township", "Neboi"],
    "Mandera West": ["Takaba", "Lagsure", "Dandu"],
    "Banissa": ["Banissa", "Derkhale", "Malkamari"]
  }
};

// =========================
// INIT AFTER LOAD
// =========================
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("admissionForm");

  const countySelect = document.getElementById("county");
  const subCountySelect = document.getElementById("sub_county");
  const wardSelect = document.getElementById("ward");

  if (!form) return;

  loadCaptcha();

  // =========================
// COUNTY → SUBCOUNTY → WARD
// =========================

const countySelect =
  document.getElementById(
    "county"
  );

const subCountySelect =
  document.getElementById(
    "sub_county"
  );

const wardSelect =
  document.getElementById(
    "ward"
  );

/* COUNTY → SUB COUNTY */

countySelect.addEventListener(
  "change",
  function () {

    const county =
      this.value;

    subCountySelect.innerHTML =
      '<option value="">Select Sub County</option>';

    wardSelect.innerHTML =
      '<option value="">Select Ward</option>';

    if (!data[county]) return;

    Object.keys(
      data[county]
    ).forEach(sub => {

      const opt =
        document.createElement(
          "option"
        );

      opt.value = sub;

      opt.textContent = sub;

      subCountySelect.appendChild(
        opt
      );

    });

  }
);

/* SUB COUNTY → WARD */

subCountySelect.addEventListener(
  "change",
  function () {

    const county =
      countySelect.value;

    const sub =
      this.value;

    wardSelect.innerHTML =
      '<option value="">Select Ward</option>';

    if (
      !data[county] ||
      !data[county][sub]
    ) return;

    data[county][sub]
      .forEach(ward => {

        const opt =
          document.createElement(
            "option"
          );

        opt.value = ward;

        opt.textContent = ward;

        wardSelect.appendChild(opt);

      });

  }
);

  // =========================
  // FORM SUBMIT (FIREBASE)
  // =========================
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    try {

      // CAPTCHA CHECK
      const answer = document.getElementById("captchaAnswer").value;

      const verify = await fetch(`${API}/verify`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer })
      });

      const verifyData = await verify.json();

      if (!verifyData.success) {
        alert("Wrong CAPTCHA Answer");
        loadCaptcha();
        return;
      }

      // CONSENT CHECK
      if (!document.getElementById("consent").checked) {
        alert("Please accept Terms & Conditions");
        return;
      }

      // FIREBASE SAVE
        const applicationNo =
  `APP-${new Date().getFullYear()}-${Date.now()
    .toString()
    .slice(-6)}`;
      await addDoc(collection(db, "applications"), {
         applicationNo,

  status: "Pending",

  processed: false,
    
        firstName: form.first_name.value,
        lastName: form.last_name.value,
        gender: form.gender.value,
        phone: form.phone.value,
        email: form.email.value,

        address: form.address.value,
        county: form.county.value,
        subCounty: form.sub_county.value,
        ward: form.ward.value,

        course: form.course.value,
        intake: form.intake.value,
        mode: form.mode_of_study.value,

        emergencyName: form.emergency_contact_name.value,
        emergencyPhone: form.emergency_contact_phone.value,

        createdAt: serverTimestamp()

      });

      
const receiptWindow = window.open("", "_blank", "width=700,height=800");

receiptWindow.document.write(`
<html>
<head>
<title>Application Receipt</title>
<style>
body{
  font-family:Arial,sans-serif;
  padding:30px;
  text-align:center;
}

.logo{
  width:80px;
/* SAVE TO FIRESTORE */

          await addDoc(
            collection(
              db,
              "applications"
            ),
            {

              applicationNo,

              status:
                "Pending",

              processed:
                false,

              registrationNo:
                "",

              pdfUrl:
                "",

              admissionLetter:
                "",

              firstName:
                form.first_name.value,

              lastName:
                form.last_name.value,

              gender:
                form.gender.value,

              phone:
                form.phone.value,

              email:
                form.email.value,

              address:
                form.address.value,

              county:
                form.county.value,

              subCounty:
                form.sub_county.value,

              ward:
                form.ward.value,

              course:
                form.course.value,

              intake:
                form.intake.value,

              mode:
                form.mode_of_study.value,

              emergencyName:
                form.emergency_contact_name.value,

              emergencyPhone:
                form.emergency_contact_phone.value,

              photoUrl,

              createdAt:
                serverTimestamp()

            }
          );

          /* SUCCESS */

          alert(
            `Application Submitted Successfully!

Application Number:
${applicationNo}`
          );

          /* RECEIPT WINDOW */

          const receiptWindow =
            window.open(
              "",
              "_blank",
              "width=700,height=800"
            );

          receiptWindow.document.write(`

          <html>

          <head>

          <title>
          Application Receipt
          </title>

          <style>

          body{
            font-family:Arial;
            padding:30px;
            text-align:center;
          }

          .receipt{
            border:2px solid #0a2342;
            padding:20px;
            max-width:600px;
            margin:auto;
          }

          .appno{
            color:red;
            font-size:22px;
            font-weight:bold;
          }

          </style>

          </head>

          <body>

          <div class="receipt">

          <h2>
          GARISSA DIGITAL EMPOWERMENT HUB
          </h2>

          <h3>
          Application Submission Receipt
          </h3>

          <p>
          ${form.first_name.value}
          ${form.last_name.value}
          </p>

          <div class="appno">
          ${applicationNo}
          </div>

          <p>
          Status: Pending Review
          </p>

          <button onclick="window.print()">
          Print / Save PDF
          </button>

          </div>

          </body>

          </html>

          `);

          receiptWindow.document.close();

          form.reset();

          loadCaptcha();

        } catch(error){

          console.error(error);

          alert(
            "Submission failed."
          );

        }

      }
    );

  }
);

</script>

</body>
</html>
