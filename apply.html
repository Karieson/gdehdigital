<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Online Application Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
      rel="stylesheet">

<style>
/* =========================
   GLOBAL
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:#fff;
    color:#111;
    font-size:11px;
    min-height:100vh;
}
/* =========================
   HEADER
========================= */
.top-bar{
    display:flex;
    align-items:center;
    gap:15px;
    margin:0 auto 25px auto;
    max-width:950px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}
.logo{
    width:85px;
    height:auto;
}
h1{
    color:#a84f00;
    font-size:20px;
    font-weight:700;
}
/* =========================
   CONTAINER
========================= */
.container{
    max-width:950px;
    margin:auto;
    padding:0 15px 40px;
}
/* =========================
   FORM BOX
========================= */
.form-box{
    background:#fff;
    border:1px solid #eee;
    border-radius:20px;
    padding:30px;
}
/* =========================
   SECTION TITLES
========================= */
h2{
    color:#a84f00;
    font-size:13px;
    font-weight:bold;
    margin:25px 0 15px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(168,79,0,0.3);
}
/* =========================
   LABELS
========================= */
label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    color:#a84f00;
    font-size:11px;
    font-weight:600;
}
.required{
    color:red;
}
/* =========================
   INPUTS
========================= */
input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:11px;
    color:#111;
    background:#fff;
    transition:0.3s ease;
}
input:focus,
select:focus,
textarea:focus{
    outline:none;
    border:1px solid #a84f00;
    box-shadow:0 0 10px rgba(168,79,0,0.15);
}
textarea{
    resize:vertical;
    min-height:90px;
}
/* =========================
   BUTTON
========================= */
.submit-btn{
    background:#a84f00;
    color:#fff;
    border:none;
    padding:13px 24px;
    font-size:12px;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s ease;
    box-shadow:0 0 12px rgba(168,79,0,0.25);
    font-weight:bold;
}
.submit-btn:hover{
    background:#8e4200;
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(168,79,0,0.4);
}
/* =========================
   CONSENT
========================= */
.consent-box{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:25px;
}
.consent-box input{
    width:auto;
    margin-top:4px;
}
.consent-box label{
    color:#333;
    font-size:10px;
    line-height:1.7;
    margin:0;
}
/* =========================
   CAPTCHA BOX
========================= */
#captchaBox{
    margin-top:20px;
    text-align:center;
    display:none;
}
/* =========================
   FOOTER
========================= */
.footer{
    background:#a84f00;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:40px;
}
.footer p{
    font-size:11px;
    font-weight:bold;
    margin-bottom:10px;
}
.footer-links a{
    color:white;
    text-decoration:none;
    font-size:10px;
    font-weight:bold;
}
.footer-links a:hover{
    text-decoration:underline;
}
/* =========================
   MOBILE
========================= */
@media(max-width:768px){
    .top-bar{
        flex-direction:column;
        text-align:center;
    }
    h1{
        font-size:17px;
    }
    .form-box{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->
<div class="top-bar">
    <img src="gdeh_logo.png" alt="GDEH Logo" class="logo">
    <h1>Online Application Form</h1>
</div>

<!-- =========================
     FORM
========================= -->
<div class="container">
<div class="form-box">

<form id="admissionForm"
      action="https://gdeh-database.onrender.com/api/admission"
      method="POST"
      enctype="multipart/form-data">

<!-- PERSONAL INFORMATION -->
<h2>Personal Information</h2>
<label>First Name <span class="required">*</span></label>
<input type="text" name="first_name" required>

<label>Last Name <span class="required">*</span></label>
<input type="text" name="last_name" required>

<label>Gender <span class="required">*</span></label>
<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>Phone Number <span class="required">*</span></label>
<input type="tel" name="phone" required>

<label>Email <span class="required">*</span></label>
<input type="email" name="email" required>

<!-- ADDRESS -->
<h2>Address</h2>
<label>Current Address <span class="required">*</span></label>
<textarea name="address" required></textarea>

<!-- LOCATION -->
<h2>Location</h2>
<label>County <span class="required">*</span></label>
<select id="county" name="county" onchange="loadSubCounties()" required>
<option value="">Select County</option>
<option value="Garissa">Garissa</option>
<option value="Wajir">Wajir</option>
<option value="Mandera">Mandera</option>
</select>

<label>Sub County <span class="required">*</span></label>
<select id="subcounty" name="sub_county" onchange="loadWards()" required>
<option value="">Select Sub County</option>
</select>

<label>Ward <span class="required">*</span></label>
<select id="ward" name="ward" required>
<option value="">Select Ward</option>
</select>

<!-- ACADEMIC -->
<h2>Academic</h2>
<label>Course Applying <span class="required">*</span></label>
<select name="course" required>
<option>Smart Phone Literacy</option>
<option>Agro-entrepreneurship</option>
<option>Computer Literacy</option>
</select>

<label>Intake <span class="required">*</span></label>
<select name="intake" required>
<option>January Intake</option>
<option>May Intake</option>
<option>September Intake</option>
</select>

<label>Mode of Study <span class="required">*</span></label>
<select name="mode_of_study" required>
<option>Online</option>
<option>Physical</option>
<option>Hybrid</option>
</select>

<!-- EMERGENCY CONTACT -->
<h2>Emergency Contact</h2>
<label>Full Name <span class="required">*</span></label>
<input type="text" name="emergency_contact_name" required>

<label>Phone Number <span class="required">*</span></label>
<input type="tel" name="emergency_contact_phone" required>

<!-- PHOTO -->
<h2>Upload</h2>
<label>Upload Profile Photo <span class="required">*</span></label>
<input type="file" name="photo" accept=".jpeg,.jpg,.png" required>

<!-- CONSENT -->
<div class="consent-box">
<input type="checkbox" id="consent" required>
<label for="consent">I have read and agree to the Terms & Conditions <span class="required">*</span></label>
</div>

<!-- CAPTCHA BOX -->
<div id="captchaBox">
    <canvas id="captchaCanvas" width="220" height="80" style="border:1px solid #ccc; border-radius:5px;"></canvas>
    <br>
    <label>Enter CAPTCHA:</label><br>
    <input id="captchaInput" placeholder="6 letters" style="padding:8px; margin-top:10px; width:200px;">
    <br><br>
    <button type="button" onclick="verifyCaptcha()" style="padding:8px 12px; cursor:pointer;">Verify</button>
</div>

<!-- SUBMIT -->
<div style="text-align:center; margin-top:30px;">
    <button type="submit" class="submit-btn">
        Submit Application
    </button>
</div>

</form>
</div>
</div>
<!-- ===== FOOTER ===== -->
<div class="footer">

© 2026 Garissa Digital Empowerment Hub |
All Rights Reserved

</div>

<script>
const API = "https://captchabackend.onrender.com"; // 🔴 change this

let captchaText = "";
let captchaVerified = false;

// =========================
// LOCATION DATA (UNCHANGED)
// =========================
const data = {
Garissa: {
"Garissa Township": ["Waberi","Galbet","Township"],
"Ijara": ["Sangailu","Ijara","Masalani"],
"Lagdera": ["Modogashe","Benane","Maalimin"]
},
Wajir: {
"Wajir East": ["Township","Barwago","Khorof"],
"Wajir West": ["Arbajahan","Hadado","Adamasajide"],
"Tarbaj": ["Tarbaj","Elben","Sarman"]
},
Mandera: {
"Mandera East": ["Arabia","Township","Neboi"],
"Mandera West": ["Takaba","Lagsure","Dandu"],
"Banissa": ["Banissa","Derkhale","Malkamari"]
}
};

// =========================
// CAPTCHA OPEN
// =========================
async function openCaptcha() {

    document.getElementById("captchaBox").style.display = "block";

    const res = await fetch(`${API}/captcha`);
    const data = await res.json();

    captchaText = data.captcha;

    drawCaptcha(captchaText);
}

// =========================
// DRAW CAPTCHA
// =========================
function drawCaptcha(text) {
    const canvas = document.getElementById("captchaCanvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, 220, 80);

    ctx.fillStyle = `hsl(${Math.random() * 360},70%,85%)`;
    ctx.fillRect(0, 0, 220, 80);

    for (let i = 0; i < 120; i++) {
        ctx.fillStyle = "#888";
        ctx.fillRect(Math.random() * 220, Math.random() * 80, 2, 2);
    }

    for (let i = 0; i < text.length; i++) {
        ctx.save();
        ctx.font = "30px Arial";
        ctx.fillStyle = `hsl(${Math.random() * 360},100%,40%)`;
        const x = 20 + i * 30;
        const y = 50;
        ctx.translate(x, y);
        ctx.rotate((Math.random() - 0.5) * 0.7);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
    }
}

// =========================
// VERIFY CAPTCHA
// =========================
async function verifyCaptcha() {

    const input = document.getElementById("captchaInput").value;

    const res = await fetch(`${API}/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: input })
    });

    const data = await res.json();

    if (data.success) {
        captchaVerified = true;

        alert("CAPTCHA verified!");

        // submit real form
        document.getElementById("admissionForm").submit();
    } else {
        alert("Wrong CAPTCHA. Try again.");
        openCaptcha();
    }
}

// =========================
// BLOCK FORM UNTIL CAPTCHA
// =========================
document.getElementById("admissionForm").addEventListener("submit", function(e) {

    if (!captchaVerified) {
        e.preventDefault();   // STOP SUBMIT
        openCaptcha();        // SHOW CAPTCHA
    }

});
</script>
</body>
</html>
