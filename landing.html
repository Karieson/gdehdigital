<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GDEH Donation & Partnership Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== GLOBAL STYLE ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#fff;
  color:#333;
  padding:20px;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.logo{
  width:80px;
  height:auto;
}

.header-content h1{
  font-size:22px;
  color:#B8860B;
  margin-bottom:5px;
  font-weight:600;
}

.header-content p{
  font-size:12px;
  font-style:italic;
  color:#666;
}

/* ===== FORM CONTAINER ===== */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* ===== SECTION TITLE ===== */
.section-title{
  border-left:4px solid #C49A00;
  padding-left:10px;
  margin-top:25px;
  margin-bottom:15px;

  font-size:12px;
  color:#003366;
  font-weight:600;
}

/* ===== LABEL ===== */
label{
  display:block;
  margin-bottom:5px;
  font-size:11px;
  color:#444;
}

/* ===== REQUIRED ===== */
.required{
  color:red;
}

/* ===== INPUTS ===== */
input,
select,
textarea{
  width:100%;
  padding:9px;
  margin-top:6px;
  margin-bottom:15px;

  border:1px solid #ddd;
  border-radius:6px;

  font-size:12px;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border:1px solid #B8860B;
  box-shadow:0 0 5px rgba(184,134,11,0.3);
}

/* ===== CHECKBOX GROUP ===== */
.checkbox-group{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:10px;
}

.checkbox-group label{
  font-size:11px;
}

/* ===== BUTTONS ===== */
.donate-btn,
.submit-btn{
  width:auto;
  min-width:160px;

  padding:10px 18px;
  border:none;
  border-radius:8px;

  font-size:13px;
  cursor:pointer;
  color:#fff;

  background:#B8860B;

  display:block;
  margin:18px auto;

  transition:0.3s ease;
}

.donate-btn:hover,
.submit-btn:hover{
  background:#C49A00;
  transform:translateY(-2px);
}

.donate-btn:active,
.submit-btn:active{
  transform:scale(0.96);
}

/* ===== FILE BUTTON ===== */
.file-upload::file-selector-button{
  background:#B8860B;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
}

/* ===== CONSENT ===== */
.consent-section{
  margin-top:15px;
}

.consent-section p{
  font-size:11px;
  margin-bottom:10px;
  line-height:1.6;
}

.consent-section a{
  color:#B8860B;
  text-decoration:none;
}

.consent-section a:hover{
  text-decoration:underline;
}

/* ===== FOOTER ===== */
.footer{
  text-align:center;
  padding:15px;
  margin-top:30px;

  border-top:1px solid #eee;

  font-size:12px;
  color:#B8860B;
}

/* ===== MOBILE ===== */
@media(max-width:768px){

  .header{
    flex-direction:column;
    text-align:center;
  }

  .logo{
    width:70px;
  }

  .header-content h1{
    font-size:18px;
  }

}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="header">

  <img src="gdeh_logo.png"
       alt="GDEH Logo"
       class="logo">

  <div class="header-content">

    <h1>
      Garissa Digital Empowerment Hub
    </h1>

    <p>
      Empowering youth through digital literacy and innovation
    </p>

  </div>

</header>

<!-- ===== FORM ===== -->
<div class="container">

<form>

<!-- SECTION A -->
<div class="section-title">
A. Donor / Partner Information
</div>

<label>
Full Name / Organization Name
<span class="required">*</span>
</label>

<input type="text"
       placeholder="Enter full name or organization"
       required>

<label>
Email Address
<span class="required">*</span>
</label>

<input type="email"
       placeholder="Enter email"
       required>

<label>
Phone Number
<span class="required">*</span>
</label>

<input type="tel"
       placeholder="Enter phone number"
       required>

<label>
Country
<span class="required">*</span>
</label>

<select required>

<option value="">
Select Country
</option>

<option>Kenya</option>
<option>Somalia</option>
<option>Uganda</option>
<option>Tanzania</option>
<option>United States</option>
<option>United Kingdom</option>
<option>Canada</option>
<option>Germany</option>
<option>Qatar</option>
<option>United Arab Emirates</option>

</select>

<label>
Preferred Contact Method
<span class="required">*</span>
</label>

<select required>

<option>Email</option>
<option>Phone</option>
<option>WhatsApp</option>

</select>

<!-- SECTION B -->
<div class="section-title">
B. Type of Support
</div>

<div class="checkbox-group">

<label>
<input type="checkbox" required>
Financial Donation
</label>

<label>
<input type="checkbox">
Equipment / Devices
</label>

<label>
<input type="checkbox">
Training / Mentorship
</label>

<label>
<input type="checkbox">
Partnership / Sponsorship
</label>

<label>
<input type="checkbox">
Volunteer Support
</label>

</div>

<!-- SECTION C -->
<div class="section-title">
C. Contribution Details
</div>

<label>
Amount / Type of Donation
<span class="required">*</span>
</label>

<input type="text"
       required>

<label>
Frequency
<span class="required">*</span>
</label>

<select required>

<option>One-time</option>
<option>Monthly</option>
<option>Annual</option>

</select>

<button type="button"
        class="donate-btn"
        onclick="payNow()">

Donate Now

</button>

<label>
Upload Proof (Optional)
</label>

<input type="file"
       class="file-upload">

<!-- SECTION D -->
<div class="section-title">
D. Collaboration Proposal
</div>

<form id="collabForm">
  <label>
    Organization Background
    <span class="required">*</span>
  </label>
  <textarea rows="3" required></textarea>

  <label>
    Proposed Area of Collaboration
    <span class="required">*</span>
  </label>
  <textarea rows="3" required></textarea>

  <label>
    Expected Outcomes
    <span class="required">*</span>
  </label>
  <textarea rows="3" required></textarea>

  <label>
    Duration / Commitment Level
    <span class="required">*</span>
  </label>
  <input type="text" required>

  <label>
    Attach Proposal Document (Optional)
  </label>
  <input type="file" class="file-upload" accept=".pdf,.doc,.docx">

<!-- CAPTCHA BOX -->
<div id="captchaBox" style="text-align:center; margin-top:20px;">
    <canvas id="captchaCanvas" width="220" height="80"
            style="border:1px solid #ccc; border-radius:5px;"></canvas>

    <br><br>

    <label>Enter CAPTCHA:</label><br>
    <input id="captchaInput" placeholder="Enter 6 letters" style="padding:8px; margin-top:10px; width:200px;">

    <br><br>

    <button type="button"
            onclick="verifyCaptcha()"
            style="padding:8px 14px; cursor:pointer; background:#B8860B; color:white; border:none; border-radius:6px;">
        Verify
    </button>
</div>

<!-- SUBMIT BUTTON -->
<button type="submit" class="submit-btn">Submit Collaboration</button>
</form>

</div>

<!-- ===== FOOTER ===== -->
<div class="footer">

© 2026 Garissa Digital Empowerment Hub |
All Rights Reserved

</div>

<script>

function payNow(){

const consent =
document.getElementById("consentCheck");

if(!consent.checked){

alert(
"Please agree to the consent before donating."
);

consent.scrollIntoView({
behavior:"smooth",
block:"center"
});

return;

}

window.location.href =
"https://www.pesapal.com/checkout/YOUR_UNIQUE_LINK";

}

</script>
  <script>
const API = "https://captchabackend.onrender.com"; // replace with your render backend
let captchaText = "";
let captchaVerified = false;

// Draw CAPTCHA on canvas
function drawCaptcha(text){
    const canvas = document.getElementById("captchaCanvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,220,80);
    ctx.fillStyle = `hsl(${Math.random()*360},70%,85%)`;
    ctx.fillRect(0,0,220,80);
    for(let i=0;i<120;i++){
        ctx.fillStyle="#777";
        ctx.fillRect(Math.random()*220,Math.random()*80,2,2);
    }
    for(let i=0;i<text.length;i++){
        ctx.save();
        ctx.font="30px Arial";
        ctx.fillStyle=`hsl(${Math.random()*360},100%,40%)`;
        const x = 20 + i*30;
        const y = 50;
        ctx.translate(x,y);
        ctx.rotate((Math.random()-0.5)*0.7);
        ctx.fillText(text[i],0,0);
        ctx.restore();
    }
}

// Open CAPTCHA by fetching from backend
async function openCaptcha(){
    const res = await fetch(`${API}/captcha`);
    const data = await res.json();
    captchaText = data.captcha;
    drawCaptcha(captchaText);
}

// Verify CAPTCHA input
async function verifyCaptcha(){
    const input = document.getElementById("captchaInput").value;
    const res = await fetch(`${API}/verify`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:input})
    });
    const data = await res.json();
    if(data.success){
        captchaVerified = true;
        alert("CAPTCHA verified! You can submit now.");
    }else{
        alert("Wrong CAPTCHA. Try again.");
        openCaptcha();
    }
}

// Form submit interceptor
document.getElementById("collabForm").addEventListener("submit", function(e){
    if(!captchaVerified){
        e.preventDefault();
        openCaptcha();
    }
});
  </script>

</body>
</html>
